[package]
name = "weeklight"
version = "1.2.1"
description = "橙子日程 · Windows 桌面日历与待办清单"
authors = ["CYJ316457"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weeklight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M0 观察用；正式版按迁移方案 §8 打开：
